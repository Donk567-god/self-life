<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Self · 加载</title>
<style>
:root{
  --bg1:#0a1020; --bg2:#0f172a; --blue:#3b82f6; --blue2:#2563eb; --teal:#0d9488;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(circle at 50% 40%, #16233b 0%, var(--bg2) 46%, var(--bg1) 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,sans-serif; overflow:hidden; cursor:pointer;
}
.stage{
  position:relative;width:360px;height:380px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  animation:cycle 4.6s ease-in-out infinite;
}
/* 低多边形玻璃球——呼应 app 图标 */
.orb{
  position:relative;width:124px;height:124px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 26%, rgba(255,255,255,.6), rgba(255,255,255,0) 42%),
    radial-gradient(circle at 72% 76%, rgba(13,148,136,.95), rgba(37,99,235,.1) 60%),
    linear-gradient(135deg, #0d9488, #2563eb);
  box-shadow:0 12px 44px rgba(37,99,235,.38), inset 0 0 34px rgba(255,255,255,.28);
  animation:orbPulse 2.3s ease-in-out infinite;
}
.orb::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0 68%, rgba(255,255,255,.55) 86%, transparent 100%);
  animation:spin 3.1s linear infinite; mix-blend-mode:screen; opacity:.55;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbPulse{0%,100%{transform:scale(.93)}50%{transform:scale(1.07)}}

/* 自绘字形「Self」—— 几何圆角胖体，非标准字体 */
.word{width:340px;height:140px;display:flex;justify-content:center;align-items:center;
  animation:glow 4.6s ease-in-out infinite;
}
.word svg{width:100%;height:100%;overflow:visible}
.letter{
  fill:none;stroke:url(#sg);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw .62s ease forwards;
}
.l1{animation-delay:.35s}
.l2{animation-delay:.78s}
.l3{animation-delay:1.21s}
.l4{animation-delay:1.64s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{
  0%,62%{filter:drop-shadow(0 0 0 rgba(59,130,246,0))}
  82%,100%{filter:drop-shadow(0 0 9px rgba(59,130,246,.6))}
}
@keyframes cycle{
  0%{opacity:0;transform:scale(.95)}
  9%{opacity:1;transform:scale(1)}
  84%{opacity:1}
  100%{opacity:0;transform:scale(1.03)}
}
.hint{position:fixed;bottom:26px;color:#5b6b85;font-size:13px;letter-spacing:2px;opacity:.65}

/* 测试用：?hold=1 停在完成态 */
body.hold .stage{animation:none;opacity:1}
body.hold .letter{stroke-dashoffset:0}
body.hold .word{filter:drop-shadow(0 0 9px rgba(59,130,246,.6))}
body.hold .orb{animation:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="orb"></div>
  <div class="word">
    <svg viewBox="0 0 360 140" aria-label="Self">
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3b82f6"/>
          <stop offset="1" stop-color="#0d9488"/>
        </linearGradient>
      </defs>
      <!-- S -->
      <path class="letter l1" pathLength="1"
        d="M92,50 C92,34 72,28 54,28 C36,28 28,40 28,54 C28,68 46,70 58,72 C72,74 92,78 92,96 C92,114 70,122 50,122 C32,122 18,110 14,96"/>
      <!-- E -->
      <path class="letter l2" pathLength="1"
        d="M120,28 L120,122 M120,28 L180,28 M120,75 L172,75 M120,122 L180,122"/>
      <!-- L -->
      <path class="letter l3" pathLength="1"
        d="M208,28 L208,122 L272,122"/>
      <!-- F -->
      <path class="letter l4" pathLength="1"
        d="M300,28 L300,122 M300,28 L356,28 M300,75 L348,75"/>
    </svg>
  </div>
</div>
<div class="hint">点击任意处重播</div>
<script>
document.body.addEventListener('click',()=>{
  const s=document.getElementById('stage');
  s.style.animation='none'; void s.offsetWidth; s.style.animation='';
});
if(new URLSearchParams(location.search).get('hold')) document.body.classList.add('hold');
</script>
</body>
</html>
