name: Build Self APK

# 触发：推送到 main 分支，或在 Actions 页面手动点击 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK（云端，无需本机环境）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget unzip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdtools.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 安装 Gradle 8.9
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -O gradle.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: 编译 Debug APK
        run: cd android-app && gradle assembleDebug --no-daemon

      - name: 上传 APK 产物（Actions 内下载，备用）
        uses: actions/upload-artifact@v4
        with:
          name: self-app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: 发布到 GitHub Releases（手机可直下）
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Self 安卓安装包（最新版）
          body: |
            Self 个人全能生活工作台 · 安卓安装包

            📱 下载下面的 app-debug.apk，在手机上允许「未知来源」安装即可使用。
            💾 所有数据保存在本机，不上传云端；建议定期点 App 内「导出」做备份。
            🔄 每次推送代码到 main 分支，此发布会自动更新为最新构建。
          artifacts: "android-app/app/build/outputs/apk/debug/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
