plugins {
    id 'com.android.application'
}

android {
    namespace 'com.self.life'
    compileSdk 34

    defaultConfig {
        applicationId "com.self.life"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Pure WebView app, no native (NDK) code needed
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {
    // No external libraries required
}
